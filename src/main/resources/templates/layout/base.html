<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechFix Solutions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .carousel-img {
      height: 340px;
      object-fit: cover;
    }

    .avatar-iniciales {
      width: 48px;
      height: 48px;
    }
  </style>
</head>

<body class="bg-body-secondary d-flex flex-column min-vh-100">
  <!-- ========== NAVBAR ========== -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/inicio}">
        <i class="bi bi-tools"></i>
        <span>TechFix Solutions</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar"
        aria-controls="main-navbar" aria-expanded="false" aria-label="Alternar navegación">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-navbar">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'inicio'} ? 'active'"
              th:href="@{/}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'"
              th:href="@{/dashboard}">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'ordenes'} ? 'active'"
              th:href="@{/ordenes}">Órdenes</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'clientes'} ? 'active'"
              th:href="@{/clientes}">Clientes</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'equipos'} ? 'active'"
              th:href="@{/equipos}">Equipos</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'contacto'} ? 'active'"
              th:href="@{/contacto}">Contacto</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2 text-white">
            <span class="fw-bold"><i class="bi bi-person-circle me-1"></i><span sec:authentication="name"></span></span>
            <span class="badge bg-warning text-dark" sec:authentication="principal.authorities"></span>
            <form th:action="@{/logout}" method="post" class="m-0">
              <button type="submit" class="btn btn-sm btn-outline-light">Cerrar Sesión</button>
            </form>
          </div>
          <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-success">
            <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
          </a>
        </div>
      </div>
    </div>
  </nav>





  <!-- ========== MAIN CONTENT ========== -->
  <main layout:fragment="content" class="flex-grow-1"></main>

  <!-- ========== FOOTER ========== -->
  <footer class="bg-danger text-white py-4 mt-auto">
    <div class="container">
      <div class="row g-3 align-items-center">
        <div class="col-12 col-md-4">
          <h5 class="fw-bold mb-1">
            <i class="bi bi-tools me-2"></i>TechFix Solutions
          </h5>
          <p class="mb-0">Lince, Lima — Perú</p>
        </div>
        <div class="col-12 col-md-4 text-md-center">
          <p class="mb-1"><i class="bi bi-telephone me-2"></i>(01) 234-5678</p>
          <p class="mb-0"><i class="bi bi-envelope me-2"></i>contacto@techfixsolutions.com</p>
        </div>
        <div class="col-12 col-md-4 text-md-end">
          <p class="mb-1">Marcos de Desarrollo Web — UTP 2026</p>
          <p class="mb-0 text-info">Mg. Jeyson Junior Ventura Aguilar</p>
        </div>
      </div>
    </div>
  </footer>

  <!-- ========== SCRIPTS ========== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (() => {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>
</body>

</html>
