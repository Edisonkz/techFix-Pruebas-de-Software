<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechFix Solutions - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-5 col-lg-4">
        
        <div class="card shadow-lg border-0 rounded-3">
          <div class="card-header bg-danger text-white text-center py-4">
            <h3 class="fw-bold mb-1">TechFix Solutions</h3>
            <p class="mb-0">Acceso al Sistema</p>
          </div>
          
          <div class="card-body p-4">
            <div th:if="${param.error}" class="alert alert-danger text-center">
              Usuario o contraseña incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success text-center">
              Has cerrado sesión correctamente.
            </div>
            
            <form th:action="@{/login}" method="post" class="p-3 needs-validation" novalidate>
              
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required>
                <label for="username">Usuario</label>
                <div class="invalid-feedback">Por favor, ingrese su usuario.</div>
              </div>
              
              <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                <label for="password">Contraseña</label>
                <div class="invalid-feedback">Por favor, ingrese su contraseña correcta.</div>
              </div>
              
              <button type="submit" class="btn btn-danger w-100 fw-bold mt-3">Ingresar</button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    (() => {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>
</body>
</html>
